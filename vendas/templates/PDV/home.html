{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Produto</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; }
        .navbar { background-color: #212529; padding: 1rem; margin-bottom: 2rem; }
        .navbar-brand { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.25rem; }
        .container { max-width: 700px; margin: 0 auto; padding: 0 15px; }
        .card { background: #fff; border-radius: 0.375rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); padding: 2rem; border: 0; margin-top: 1rem; }
        .h3 { font-size: 1.75rem; margin-bottom: 1.5rem; color: #495057; }
        .btn { display: inline-block; font-weight: 400; text-align: center; padding: 0.375rem 0.75rem; font-size: 1rem; border-radius: 0.25rem; text-decoration: none; cursor: pointer; }
        .btn-success { color: #fff; background-color: #198754; border: none; }
        .btn-light { color: #212529; background-color: #f8f9fa; border: 1px solid #ced4da; }
        .d-flex { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem; border-top: 1px solid #dee2e6; padding-top: 1rem; }
        /* Estilização para o formulário do Django */
        p { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #495057; }
        input[type="text"], input[type="number"], textarea, select { display: block; width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 0.375rem; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
    </style>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar"><div class="container"><a class="navbar-brand" href="{% url 'vendas:Pinicial' %}">💵 FiadoFacil</a></div></nav>
  <div class="container-fluid">
    <div class="row">

        <!-- PRODUTOS -->
        <div class="col-md-8">
            <h3>Produtos</h3>

            <div class="row">
                {% for itens in itens %}
                <div class="col-md-4 mb-3">
                    <div class="card produto-card"
                         onclick="adicionarProduto(
                            '{{ itens.id }}',
                            '{{ itens.nome }}',
                            '{{ itens.preco }}'
                         )">

                        <div class="card-body">
                            <h5>{{ itens.nome }}</h5>

                            <p>
                                R$ {{ itens.preco }}
                            </p>

                            <small>
                                Estoque: {{ itens.quantidade }}
                            </small>
                        </div>

                    </div>
                </div>
                {% endfor %}
            </div>

        </div>

        <!-- CARRINHO -->
        <div class="col-md-4">

            <h3>Carrinho</h3>

            <table class="table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Qtd</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="carrinho">
                </tbody>

            </table>

            <hr>

            <h4 id="valorTotal">
                Total: R$ 0,00
            </h4>

            <button
                class="btn btn-success w-100"
                onclick="finalizarVenda()">

                Finalizar Venda

            </button>

        </div>

    </div>
</div>

<script>

let carrinho = [];

function adicionarProduto(id, nome, preco){

    preco = parseFloat(preco);

    let item = carrinho.find(p => p.id == id);

    if(item){

        item.quantidade++;

    }else{

        carrinho.push({
            id:id,
            nome:nome,
            preco:preco,
            quantidade:1
        });

    }

    atualizarCarrinho();

}

function atualizarCarrinho(){

    let tabela =
        document.getElementById("carrinho");

    tabela.innerHTML = "";

    let total = 0;

    carrinho.forEach(item => {

        let subtotal =
            item.preco * item.quantidade;

        total += subtotal;

        tabela.innerHTML += `
        <tr>
            <td>${item.nome}</td>
            <td>${item.quantidade}</td>
            <td>R$ ${subtotal.toFixed(2)}</td>
        </tr>
        `;
    });

    document.getElementById(
        "valorTotal"
    ).innerText =
        "Total: R$ " + total.toFixed(2);

}

function finalizarVenda(){

    alert(
        "Venda finalizada. Próximo passo é gravar no banco."
    );

}

</script>
</body>
</html>
