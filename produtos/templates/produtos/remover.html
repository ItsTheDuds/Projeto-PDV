<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Produto</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; }
        .navbar { background-color: #212529; padding: 1rem; margin-bottom: 2rem; }
        .navbar-brand { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.25rem; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .card { background: #fff; border-radius: 0.375rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); padding: 2rem; border: 0; margin-top: 1rem; }
        .h3 { font-size: 1.75rem; margin-bottom: 1rem; color: #dc3545; }
        .lead { font-size: 1.15rem; margin-bottom: 1.5rem; color: #495057; }
        .product-preview { background-color: #f1f3f5; padding: 1rem; border-radius: 0.25rem; margin-bottom: 1.5rem; border-left: 4px solid #dc3545; }
        .product-name { font-weight: 600; color: #212529; }
        .btn { display: inline-block; font-weight: 400; text-align: center; padding: 0.375rem 0.75rem; font-size: 1rem; border-radius: 0.25rem; text-decoration: none; cursor: pointer; box-sizing: border-box; }
        .btn-danger { color: #fff; background-color: #dc3545; border: none; }
        .btn-light { color: #212529; background-color: #f8f9fa; border: 1px solid #ced4da; }
        .d-flex { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem; border-top: 1px solid #dee2e6; padding-top: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'produtos:produtos_home' %}">⚙️ Dashboard Produtos</a>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h1 class="h3">⚠️ Confirmar Exclusão</h1>
            <p class="lead">Tem certeza de que deseja remover permanentemente este produto?</p>
            
            <div class="product-preview">
                Item selecionado: <span class="product-name">{{ produto.nome }}</span>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex">
                    <a href="{% url 'produtos:produtos_home' %}" class="btn btn-light">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sim, remover produto</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
