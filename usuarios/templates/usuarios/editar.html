<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; }
        .navbar { background-color: #212529; padding: 1rem; margin-bottom: 2rem; }
        .navbar-brand { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.25rem; }
        .container { max-width: 700px; margin: 0 auto; padding: 0 15px; }
        .card { background: #fff; border-radius: 0.375rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); padding: 2rem; border: 0; margin-top: 1rem; }
        .h3 { font-size: 1.75rem; margin-bottom: 1.5rem; color: #495057; }
        .btn { display: inline-block; font-weight: 400; text-align: center; padding: 0.375rem 0.75rem; font-size: 1rem; border-radius: 0.25rem; text-decoration: none; cursor: pointer; }
        .btn-warning { color: #000; background-color: #ffc107; border: none; font-weight: 500; }
        .btn-light { color: #212529; background-color: #f8f9fa; border: 1px solid #ced4da; }
        .d-flex { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem; border-top: 1px solid #dee2e6; padding-top: 1rem; }
        p { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #495057; }
        input[type="text"], input[type="email"], input[type="password"] { display: block; width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 0.375rem; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container"><a class="navbar-brand" href="{% url 'usuarios:usuarios_home' %}">⚙️ Dashboard Usuários</a></div></nav>
    <div class="container">
        <div class="card">
            <h1 class="h3">Edição de Usuário</h1>
            <form action="{% url 'usuarios:usuarios_editar' id=usuario.id %}" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex">
                    <a href="{% url 'usuarios:usuarios_home' %}" class="btn btn-light">Cancelar</a>
                    <button type="submit" class="btn btn-warning">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
