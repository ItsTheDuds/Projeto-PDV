<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
</head>
<body>
    <h1>Bem-vindo à página de edição de usuário!</h1>
    <form action="{% url 'usuarios:usuarios_editar' id=usuario.id %}" method="post">
        {% csrf_token %}
        {{ form }}
        <input type="submit" value="Salvar">
        <a href="{% url 'usuarios:usuarios_home' %}">Cancelar</a>
    </form>
</body>
</html>
