<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <h1>Bem-vindo à página inicial!</h1>
    <table border="1">
        <thead>
            <tr>
                <th>USUÁRIOS</th>
                <th>E-MAIL</th>
                <th>REMOVER</th>
                <th>EDITAR</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.username }}</td>
                <td>{{ usuario.email }}</td>
                <td>
                    <a href="{% url 'usuarios:usuarios_remover' id=usuario.id %}">Remover</a>
                </td>
                <td>
                    <a href="{% url 'usuarios:usuarios_editar' id=usuario.id %}">Editar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <br>
    <a href="{% url 'usuarios:usuarios_buscar' %}">Buscar</a>
    <br>
    <a href="{% url 'usuarios:usuarios_adicionar' %}">Adicionar</a>
    <br>
    <a href="{% url 'home' %}">Voltar</a>
    <br>
</body>
</html>
