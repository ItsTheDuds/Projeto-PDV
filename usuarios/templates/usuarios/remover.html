<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Usuário</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; }
        .navbar { background-color: #212529; padding: 1rem; margin-bottom: 2rem; }
        .navbar-brand { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.25rem; }
        .container { max-width: 700px; margin: 0 auto; padding: 0 15px; }
        .card { background: #fff; border-radius: 0.375rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); padding: 2rem; border-left: 5px solid #dc3545; margin-top: 1rem; }
        .h3 { font-size: 1.75rem; color: #dc3545; margin-top: 0; margin-bottom: 1rem; }
        .fs-5 { font-size: 1.15rem; color: #6c757d; margin-bottom: 1.5rem; }
        .table { width: 100%; border-color: #dee2e6; border-collapse: collapse; margin-bottom: 1.5rem; background: #fff; }
        .table th { background-color: #f8f9fa; color: #212529; padding: 0.75rem; text-align: left; border: 1px solid #dee2e6; }
        .table td { padding: 0.75rem; border: 1px solid #dee2e6; }
        .btn { display: inline-block; font-weight: 400; text-align: center; padding: 0.375rem 0.75rem; font-size: 1rem; border-radius: 0.25rem; text-decoration: none; cursor: pointer; }
        .btn-danger { color: #fff; background-color: #dc3545; border: none; }
        .btn-secondary { color: #fff; background-color: #6c757d; border: none; }
        .d-flex { display: flex; justify-content: flex-end; gap: 0.5rem; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container"><a class="navbar-brand" href="{% url 'usuarios:usuarios_home' %}">⚙️ Dashboard Usuários</a></div></nav>
    <div class="container">
        <div class="card">
            <h1 class="h3">⚠️ Atenção!</h1>
            <p class="fs-5">Tem certeza que deseja remover permanentemente o usuário abaixo?</p>
            <table class="table">
                <thead>
                    <tr><th>Username</th><th>Email</th></tr>
                </thead>
                <tbody>
                    <tr><td style="font-weight: 600;">{{ usuario.username }}</td><td>{{ usuario.email }}</td></tr>
                </tbody>
            </table>
            <form action="{% url 'usuarios:usuarios_remover' id=usuario.id %}" method="post">
                {% csrf_token %}
                <div class="d-flex">
                    <a href="{% url 'usuarios:usuarios_home' %}" class="btn btn-secondary">Não, Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sim, Remover</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
