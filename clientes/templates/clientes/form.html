{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="card" style="max-width:700px; margin:0 auto;">
    <div class="page-header">
        <div>
            <h1 class="page-title">{{ titulo }}</h1>
            <p class="subtitle">Celular obrigatório. E-mail opcional.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <a href="{% url 'clientes:home' %}" class="btn btn-light">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar cliente</button>
        </div>
    </form>
</div>
{% endblock %}


{% block extra_js %}
<script>
(function () {
    const input = document.getElementById('id_celular');
    if (!input) return;

    function formatarCelular(valor) {
        let numeros = valor.replace(/\D/g, '').slice(0, 11);

        if (numeros.length <= 2) {
            return numeros ? '(' + numeros : '';
        }
        if (numeros.length <= 7) {
            return '(' + numeros.slice(0, 2) + ') ' + numeros.slice(2);
        }
        return (
            '(' + numeros.slice(0, 2) + ') ' +
            numeros.slice(2, 7) + '-' +
            numeros.slice(7)
        );
    }

    input.value = formatarCelular(input.value);

    input.addEventListener('input', function () {
        this.value = formatarCelular(this.value);
    });
})();
</script>
{% endblock %}
